name: Build Staff Orders APK

# Runs in GitHub's own cloud runner (which has full internet access to the
# Android SDK / Google Maven servers, unlike a locked-down sandbox), so the
# APK is produced automatically without anyone needing Android Studio.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "manifest.json"
      - "twa-manifest.json"
      - "sw.js"
      - "admin.html"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # Bubblewrap looks for sdkmanager at <SDK>/tools/bin/ or <SDK>/bin/,
      # but the modern SDK layout puts it at <SDK>/cmdline-tools/latest/bin/.
      # Symlink so Bubblewrap's path check finds it either way.
      - name: Shim SDK layout for Bubblewrap's expected path
        run: ln -sfn "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      # Bubblewrap's first run interactively asks "download the JDK/Android
      # SDK now?" — there's no TTY in CI to answer that, so it would just
      # hang. Pre-writing its config file with the JDK/SDK already set up
      # above skips that prompt entirely.
      - name: Pre-configure Bubblewrap to use the runner's JDK/SDK
        run: |
          mkdir -p "$HOME/.bubblewrap"
          cat > "$HOME/.bubblewrap/config.json" <<EOF
          {"jdkPath":"${JAVA_HOME}","androidSdkPath":"${ANDROID_HOME}"}
          EOF
          cat "$HOME/.bubblewrap/config.json"

      # Wait for GitHub Pages to actually be serving the latest manifest.json
      # and icons before Bubblewrap tries to fetch them — Pages deploys lag a
      # commit by a minute or two. If this keeps failing, just re-run the
      # workflow manually (Actions tab → this workflow → "Run workflow").
      - name: Wait for GitHub Pages to serve the latest manifest
        run: |
          URL="https://itz-ydv-golu-06.github.io/menusanskarbackup/manifest.json"
          for i in $(seq 1 20); do
            if curl -fsS "$URL" > /dev/null; then
              echo "Pages is live."
              break
            fi
            echo "Waiting for Pages deploy... ($i/20)"
            sleep 15
          done

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing repo secret SG_KEYSTORE_BASE64 — add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android.keystore

      - name: Install @bubblewrap/core (for the scaffolding script)
        run: npm install @bubblewrap/core

      - name: Generate the Android/TWA project (non-interactive)
        run: node scripts/generate-twa-project.js

      - name: Build signed APK with Bubblewrap
        env:
          # Bubblewrap reads these two exact env var names to sign
          # non-interactively in CI — not CLI flags.
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.SG_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.SG_KEY_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Locate build output
        id: find_apk
        run: |
          APK=$(find . -maxdepth 2 -iname "*.apk" | head -n1)
          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sg-staff-orders-apk
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
